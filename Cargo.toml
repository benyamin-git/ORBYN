[package]
name = "orbyn"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Screensaver creatures that roam your terminal to prevent screen burn-in"
repository = "https://github.com/benyamin-git/ORBYN"
readme = "README.md"
license-file = "LICENSE"
keywords = ["terminal", "screensaver", "burn-in", "ascii", "cli"]
categories = ["command-line-utilities", "graphics"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
